<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#100b0b">

<title>A little wall for you ♡</title>

<style>
:root{
  --cream:#fff3d5;
  --warm:#ffd879;
  --pink:#f4a5c8;
  --ink:#17100f;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:#080606;
  color:#fff;
  font-family:Georgia,serif;
}

body{overflow-x:hidden}
button{font:inherit}

/* INTRO */

#intro{
  position:fixed;
  inset:0;
  z-index:100;
  background:radial-gradient(circle at 50% 55%,#2a1913 0,#0d0808 45%,#050303 100%);
  display:grid;
  place-items:center;
  transition:opacity 1.2s ease,visibility 1.2s;
}

.intro-inner{
  text-align:center;
  padding:30px;
  max-width:520px;
}

.mini-light{
  width:8px;
  height:8px;
  background:#ffd77a;
  border-radius:50%;
  display:inline-block;
  box-shadow:0 0 18px 7px #ffd77a;
  margin:0 4px;
  animation:pulse 1.8s infinite alternate;
}

#intro h1{
  font-size:clamp(30px,9vw,58px);
  font-weight:400;
  margin:28px 0 12px;
  letter-spacing:.02em;
}

#intro p{
  font-family:system-ui,sans-serif;
  opacity:.72;
  line-height:1.6;
}

#enter{
  margin-top:28px;
  border:1px solid rgba(255,240,200,.4);
  background:rgba(255,255,255,.07);
  color:#fff5dc;
  border-radius:999px;
  padding:13px 23px;
  cursor:pointer;
  backdrop-filter:blur(8px);
}

#enter:active{transform:scale(.97)}

/* ROOM */

#site{
  opacity:0;
  transition:opacity 1.2s ease;
  min-height:100vh;
}

#site.on{opacity:1}

.room{
  min-height:100vh;
  padding:44px 12px 120px;
  background:
    radial-gradient(circle at 50% 20%,rgba(255,196,112,.10),transparent 30%),
    linear-gradient(180deg,#17100e 0,#0b0707 55%,#050303 100%);
}

.heading{
  text-align:center;
  margin:0 auto 26px;
  max-width:620px;
}

.heading .eyebrow{
  font:600 11px/1.4 system-ui,sans-serif;
  letter-spacing:.25em;
  text-transform:uppercase;
  color:#f6cf89;
  opacity:.85;
}

.heading h2{
  font-size:clamp(27px,7vw,45px);
  font-weight:400;
  margin:9px 0 5px;
}

.heading p{
  margin:0;
  color:#e8d9c5;
  opacity:.72;
  font:14px/1.5 system-ui,sans-serif;
}

/* WALL */

.wall-wrap{
  width:min(94vw,650px);
  margin:auto;
  position:relative;
  padding:24px 12px 30px;
}

.wall{
  position:relative;
  aspect-ratio:.72;
  background:
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),
    linear-gradient(180deg,#241b19,#171111 65%,#120d0d);
  background-size:28px 28px,28px 28px,100% 100%;
  border-radius:6px;
  box-shadow:
    0 30px 70px rgba(0,0,0,.65),
    inset 0 0 0 1px rgba(255,255,255,.06);
  overflow:hidden;
}

.grid{
  position:absolute;
  inset:4%;
  opacity:.78;
  background:
    linear-gradient(#18100f 0 0) center/100% 2px no-repeat,
    repeating-linear-gradient(
      0deg,
      transparent 0 19.5%,
      rgba(22,13,12,.95) 19.5% 20.2%
    ),
    repeating-linear-gradient(
      90deg,
      transparent 0 19.5%,
      rgba(22,13,12,.95) 19.5% 20.2%
    );
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));
}

.grid:before,
.grid:after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
}

.grid:before{
  background:repeating-linear-gradient(
    90deg,
    transparent 0 19.5%,
    #17100f 19.5% 20.2%
  );
}

.grid:after{
  background:repeating-linear-gradient(
    0deg,
    transparent 0 19.5%,
    #17100f 19.5% 20.2%
  );
}

/* LIGHTS */

.lights{
  position:absolute;
  inset:2%;
  z-index:8;
  pointer-events:none;
}

.wire{
  position:absolute;
  inset:2%;
  border:2px solid #1b1514;
  border-radius:8px;
}

.bulb{
  position:absolute;
  width:9px;
  height:9px;
  border-radius:50%;
  background:#ffe39a;
  box-shadow:
    0 0 10px 4px rgba(255,210,108,.72),
    0 0 25px 8px rgba(255,170,50,.22);
  animation:twinkle 2.5s infinite alternate;
}

.b1{left:10%;top:1%}
.b2{left:31%;top:1%}
.b3{left:53%;top:1%;animation-delay:.8s}
.b4{left:77%;top:2%;animation-delay:1.2s}

.b5{left:96%;top:24%;animation-delay:.3s}
.b6{left:96%;top:52%;animation-delay:1s}
.b7{left:96%;top:80%;animation-delay:.4s}

.b8{left:70%;top:99%}
.b9{left:46%;top:99%;animation-delay:.9s}
.b10{left:22%;top:99%;animation-delay:.2s}

.b11{left:1%;top:74%;animation-delay:1.1s}
.b12{left:1%;top:43%;animation-delay:.6s}
.b13{left:1%;top:16%;animation-delay:.1s}

/* NORMAL PHOTOS */

.photo{
  position:absolute;
  z-index:4;
  background:#eee9dd;
  padding:6px 6px 17px;
  box-shadow:0 7px 13px rgba(0,0,0,.48);
  transform:rotate(var(--r));
  cursor:pointer;
  transition:
    transform .25s,
    filter .25s,
    box-shadow .25s;
  will-change:transform;
}

.photo:after{
  content:"";
  position:absolute;
  left:50%;
  top:-8px;
  width:17px;
  height:9px;
  border-radius:3px;
  background:#e6d1a2;
  transform:translateX(-50%) rotate(-4deg);
  box-shadow:0 1px 2px #0004;
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.photo:hover{
  transform:rotate(0deg) scale(1.04);
  z-index:20;
}

/* KEYCHAINS
   No white card.
   The multiply blend makes the white JPG background visually
   disappear into the wall while preserving the object. */

.keychain{
  background:transparent !important;
  padding:0 !important;
  box-shadow:none !important;
  border-radius:0;
  overflow:visible;
}

.keychain:after{
  content:"";
  position:absolute;
  left:50%;
  top:-13px;
  width:8px;
  height:18px;
  border:2px solid #b99a70;
  border-bottom:0;
  border-radius:8px 8px 0 0;
  background:transparent;
  transform:translateX(-50%);
  box-shadow:0 1px 3px #0008;
}

.keychain img{
  object-fit:contain !important;
  mix-blend-mode:multiply;
  filter:
    drop-shadow(0 7px 5px rgba(0,0,0,.65))
    drop-shadow(0 0 8px rgba(255,190,90,.08));
  background:transparent;
  border-radius:0;
}

.keychain:hover{
  filter:
    drop-shadow(0 0 10px rgba(255,211,125,.35));
}

/* POSITIONS */

.p1{
  left:5%;
  top:7%;
  width:20%;
  height:16%;
  --r:-4deg
}

.p2{
  left:29%;
  top:7%;
  width:17%;
  height:18%;
  --r:2deg
}

.p3{
  left:54%;
  top:7%;
  width:20%;
  height:17%;
  --r:-3deg
}

.p4{
  left:76%;
  top:14%;
  width:18%;
  height:25%;
  --r:4deg
}

.p5{
  left:8%;
  top:29%;
  width:23%;
  height:23%;
  --r:-3deg
}

.p6{
  left:36%;
  top:29%;
  width:17%;
  height:18%;
  --r:2deg
}

.p7{
  left:59%;
  top:29%;
  width:22%;
  height:22%;
  --r:-2deg
}

.p8{
  left:7%;
  top:55%;
  width:20%;
  height:21%;
  --r:4deg
}

.p9{
  left:31%;
  top:52%;
  width:22%;
  height:24%;
  --r:-2deg
}

.p10{
  left:59%;
  top:56%;
  width:20%;
  height:22%;
  --r:3deg
}

.p11{
  left:34%;
  top:78%;
  width:20%;
  height:18%;
  --r:-2deg
}

/* DECOR */

.deco{
  position:absolute;
  z-index:10;
  pointer-events:none;
  filter:drop-shadow(0 2px 3px #0008);
}

.butterfly{
  font-size:clamp(23px,6vw,38px);
  animation:float 4s ease-in-out infinite;
}

.bt1{
  left:2%;
  top:24%;
  transform:rotate(-12deg)
}

.bt2{
  left:49%;
  top:21%;
  animation-delay:1s
}

.bt3{
  right:2%;
  top:42%;
  transform:scale(.8);
  animation-delay:1.8s
}

.bt4{
  left:4%;
  bottom:9%;
  transform:scale(.7) rotate(10deg);
  animation-delay:2.2s
}

.heart{
  font-size:26px;
  color:#eab1c5
}

.h1{left:24%;top:46%}
.h2{right:20%;bottom:19%}
.h3{left:18%;bottom:5%}

.hanging{
  position:absolute;
  z-index:11;
  width:3px;
  background:#30211d;
  transform-origin:top;
}

.hang1{
  left:17%;
  top:0;
  height:19%
}

.hang2{
  right:13%;
  top:0;
  height:25%
}

.ornament{
  position:absolute;
  z-index:12;
  font-size:26px;
}

.o1{left:4%;top:91%}
.o2{right:1%;top:9%}
.o3{right:5%;bottom:4%}

.note{
  position:absolute;
  z-index:14;
  left:47%;
  top:43%;
  transform:translate(-50%,-50%) rotate(-2deg);
  background:#f7e8c6;
  color:#32231b;
  padding:8px 10px;
  font:700 9px/1.2 system-ui,sans-serif;
  letter-spacing:.08em;
  box-shadow:0 4px 8px #0007;
}

.tap-hint{
  text-align:center;
  font:12px system-ui,sans-serif;
  color:#ddcdb9;
  opacity:.6;
  margin-top:18px;
}

/* ENVELOPE */

.envelope{
  position:absolute;
  z-index:30;
  left:58%;
  top:79%;
  width:24%;
  aspect-ratio:1.45;
  cursor:pointer;
  transform:rotate(3deg);
  filter:drop-shadow(0 9px 9px rgba(0,0,0,.6));
  transition:transform .3s,filter .3s;
}

.envelope:hover{
  transform:rotate(0deg) scale(1.06);
  filter:
    drop-shadow(0 9px 9px rgba(0,0,0,.6))
    drop-shadow(0 0 12px rgba(255,210,125,.2));
}

.envelope-back{
  position:absolute;
  inset:0;
  background:#ead7b5;
  border-radius:3px;
  overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(91,59,35,.18);
}

.envelope-back:before,
.envelope-back:after{
  content:"";
  position:absolute;
  bottom:-1px;
  width:72%;
  height:80%;
  background:#dfc59c;
}

.envelope-back:before{
  left:-20%;
  transform:skew(-34deg);
}

.envelope-back:after{
  right:-20%;
  transform:skew(34deg);
}

.envelope-front{
  position:absolute;
  inset:0;
  background:#f0dfbd;
  clip-path:polygon(0 35%,50% 75%,100% 35%,100% 100%,0 100%);
  z-index:3;
}

.envelope-flap{
  position:absolute;
  inset:0;
  background:#f5e5c5;
  clip-path:polygon(0 0,100% 0,50% 67%);
  transform-origin:top center;
  z-index:5;
  transition:transform .9s cubic-bezier(.2,.75,.2,1);
  backface-visibility:hidden;
  box-shadow:0 2px 3px rgba(70,45,25,.18);
}

.envelope.open .envelope-flap{
  transform:rotateX(180deg);
}

.envelope-label{
  position:absolute;
  z-index:8;
  left:50%;
  top:52%;
  transform:translate(-50%,-50%);
  color:#624634;
  font-family:"Segoe Print","Bradley Hand",cursive;
  font-size:clamp(7px,1.7vw,13px);
  white-space:nowrap;
  text-align:center;
  pointer-events:none;
}

.envelope-label strong{
  display:block;
  font-size:1.15em;
  font-weight:400;
}

.envelope-hint{
  position:absolute;
  top:106%;
  left:50%;
  transform:translateX(-50%);
  white-space:nowrap;
  font:8px system-ui,sans-serif;
  color:#e5d3bd;
  opacity:.65;
}

/* LETTER MODAL */

.letter-overlay{
  position:fixed;
  inset:0;
  z-index:500;
  background:rgba(5,3,3,.88);
  backdrop-filter:blur(14px);
  display:none;
  place-items:center;
  padding:20px;
  overflow:auto;
}

.letter-overlay.open{
  display:grid;
}

.letter-stage{
  width:min(92vw,570px);
  max-height:90vh;
  position:relative;
  perspective:1000px;
}

.letter-paper{
  background:
    radial-gradient(circle at 20% 20%,rgba(130,87,48,.035),transparent 20%),
    radial-gradient(circle at 80% 70%,rgba(130,87,48,.035),transparent 20%),
    #f7ecd3;
  color:#39271f;
  border-radius:2px;
  padding:clamp(28px,7vw,55px) clamp(24px,7vw,58px);
  box-shadow:
    0 35px 100px rgba(0,0,0,.75),
    inset 0 0 35px rgba(120,78,39,.07);
  position:relative;
  transform:translateY(35px) scale(.96);
  opacity:0;
  animation:letterAppear 1s .65s cubic-bezier(.2,.75,.2,1) forwards;
  overflow:auto;
  max-height:86vh;
}

.letter-paper:before{
  content:"";
  position:absolute;
  inset:10px;
  border:1px solid rgba(105,70,40,.12);
  pointer-events:none;
}

.letter-top{
  text-align:center;
  font-family:"Segoe Print","Bradley Hand",cursive;
  color:#a06c48;
  font-size:12px;
  letter-spacing:.08em;
  margin-bottom:20px;
}

.letter-paper h3{
  text-align:center;
  font-family:"Segoe Print","Bradley Hand",cursive;
  font-size:clamp(25px,7vw,38px);
  font-weight:400;
  margin:0 0 26px;
  color:#54352a;
}

.letter-text{
  font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive;
  font-size:clamp(14px,3.7vw,18px);
  line-height:1.95;
}

.letter-line{
  opacity:0;
  transform:translateY(8px);
  animation:writeLine .55s ease forwards;
}

.letter-line:nth-child(1){animation-delay:1.25s}
.letter-line:nth-child(2){animation-delay:1.7s}
.letter-line:nth-child(3){animation-delay:2.15s}
.letter-line:nth-child(4){animation-delay:2.6s}
.letter-line:nth-child(5){animation-delay:3.05s}
.letter-line:nth-child(6){animation-delay:3.5s}
.letter-line:nth-child(7){animation-delay:3.95s}
.letter-line:nth-child(8){animation-delay:4.4s}
.letter-line:nth-child(9){animation-delay:4.85s}
.letter-line:nth-child(10){animation-delay:5.3s}
.letter-line:nth-child(11){animation-delay:5.75s}
.letter-line:nth-child(12){animation-delay:6.2s}

.letter-sign{
  margin-top:28px;
  text-align:right;
  font-family:"Segoe Print","Bradley Hand",cursive;
  font-size:22px;
  color:#704534;
  opacity:0;
  animation:writeLine .7s 6.5s ease forwards;
}

.letter-close{
  position:absolute;
  right:10px;
  top:8px;
  border:0;
  background:rgba(255,255,255,.08);
  color:#f8ead5;
  width:40px;
  height:40px;
  border-radius:50%;
  font-size:23px;
  cursor:pointer;
  z-index:10;
}

/* SCROLL LETTER SECTION */

.letter-section{
  width:min(92vw,650px);
  margin:100px auto 0;
  text-align:center;
  opacity:0;
  transform:translateY(35px);
  transition:opacity 1s ease,transform 1s ease;
}

.letter-section.visible{
  opacity:1;
  transform:none;
}

.letter-section .small-note{
  font:600 10px system-ui,sans-serif;
  letter-spacing:.25em;
  color:#f2c979;
  text-transform:uppercase;
}

.letter-section h3{
  font-size:clamp(29px,8vw,48px);
  font-weight:400;
  margin:12px 0 8px;
}

.letter-section p{
  color:#d9c9b7;
  font:14px/1.7 system-ui,sans-serif;
  max-width:470px;
  margin:0 auto 25px;
}

.scroll-letter{
  border:1px solid rgba(255,216,140,.22);
  background:rgba(255,255,255,.035);
  border-radius:20px;
  padding:22px;
  color:#f2dfc0;
  font-family:"Segoe Print","Bradley Hand",cursive;
  font-size:18px;
  line-height:1.8;
  box-shadow:0 20px 50px #0007;
  cursor:pointer;
  transition:transform .25s,background .25s;
}

.scroll-letter:hover{
  transform:translateY(-4px);
  background:rgba(255,255,255,.055);
}

/* MESSAGE */

.message{
  width:min(92vw,650px);
  margin:70px auto 0;
  padding:30px 24px;
  border:1px solid rgba(255,216,140,.18);
  background:rgba(255,255,255,.035);
  border-radius:24px;
  box-shadow:0 20px 50px #0007;
  display:none;
  text-align:center;
}

.message.show{
  display:block;
  animation:rise 1s ease both;
}

.message .tiny{
  font:700 10px system-ui,sans-serif;
  letter-spacing:.24em;
  color:#f2c979;
}

.message h3{
  font-size:clamp(32px,8vw,54px);
  font-weight:400;
  margin:12px 0;
}

.message p{
  font:16px/1.8 system-ui,sans-serif;
  color:#eadcc9;
  white-space:pre-line;
}

.signature{
  margin-top:25px;
  font-size:18px;
  color:#f2c979;
}

/* PHOTO MODAL */

.modal{
  position:fixed;
  inset:0;
  z-index:200;
  background:rgba(5,3,3,.86);
  backdrop-filter:blur(12px);
  display:none;
  place-items:center;
  padding:20px;
}

.modal.open{
  display:grid;
}

.card{
  width:min(92vw,420px);
  background:#f8edd8;
  color:#251916;
  border-radius:18px;
  padding:10px;
  box-shadow:0 30px 90px #000;
}

.card img{
  width:100%;
  max-height:58vh;
  object-fit:contain;
  border-radius:12px;
  background:#1b1210;
}

.card-body{
  padding:12px 8px 14px;
  text-align:center;
}

.card-body h4{
  margin:0 0 6px;
  font-size:22px;
  font-weight:400;
}

.card-body p{
  margin:0;
  font:13px/1.5 system-ui,sans-serif;
  opacity:.75;
}

.close{
  position:absolute;
  right:18px;
  top:18px;
  border:0;
  background:#fff1;
  color:#fff;
  border-radius:50%;
  width:42px;
  height:42px;
  font-size:22px;
}

/* ANIMATIONS */

@keyframes pulse{
  to{
    opacity:.45;
    box-shadow:0 0 10px 3px #ffd77a
  }
}

@keyframes twinkle{
  to{
    opacity:.55;
    transform:scale(.8)
  }
}

@keyframes float{
  0%,100%{translate:0 0}
  50%{translate:0 -8px}
}

@keyframes rise{
  from{
    opacity:0;
    transform:translateY(25px)
  }
  to{
    opacity:1;
    transform:none
  }
}

@keyframes letterAppear{
  from{
    opacity:0;
    transform:translateY(35px) scale(.96) rotateX(4deg)
  }
  to{
    opacity:1;
    transform:none
  }
}

@keyframes writeLine{
  from{
    opacity:0;
    transform:translateY(8px)
  }
  to{
    opacity:1;
    transform:none
  }
}

@media(max-width:420px){

  .wall-wrap{
    padding-left:2px;
    padding-right:2px
  }

  .photo{
    padding:4px 4px 12px
  }

  .photo:after{
    width:13px;
    height:7px;
    top:-6px
  }

  .note{
    font-size:7px
  }

  .envelope{
    width:25%;
  }

  .letter-paper{
    padding:32px 25px;
  }

  .letter-text{
    font-size:14px;
    line-height:1.85;
  }
}
</style>
</head>

<body>

<!-- INTRO -->

<div id="intro">

  <div class="intro-inner">

    <div>
      <span class="mini-light"></span>
      <span class="mini-light" style="animation-delay:.6s"></span>
      <span class="mini-light" style="animation-delay:1.1s"></span>
    </div>

    <h1>A little something for you ♡</h1>

    <p>
      I saw your little wall of things you love…<br>
      so I wanted to make my own version of it.
    </p>

    <button id="enter">turn on the lights ✨</button>

  </div>

</div>


<!-- MAIN SITE -->

<main id="site">

<section class="room">

<header class="heading">

  <div class="eyebrow">for your birthday</div>

  <h2>a little piece of your wall</h2>

  <p>tap the pictures. some of them have something to say.</p>
